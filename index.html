<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>滚滚贪吃蛇</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Comic Sans MS", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        min-height: 100vh;
        background: #fff4fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px;
        overscroll-behavior: none;
    }

    h1 {
        color: #ff6fa5;
        font-size: 28px;
        margin-bottom: 10px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 #ffffff, 3px 3px 0 rgba(255, 111, 165, 0.25);
        text-align: center;
    }

    .info-panel {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 16px;
        color: #5a4a5a;
        background: #ffffff;
        padding: 8px 16px;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(255, 182, 193, 0.35);
    }

    .control-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
    }

    button {
        padding: 8px 16px;
        border: none;
        border-radius: 999px;
        font-size: 15px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    button:active {
        transform: translateY(0);
        opacity: 0.92;
    }

    #startBtn { background: #8ce3a6; }
    #pauseBtn { background: #9cd0ff; }
    #resetBtn { background: #ffb3d1; }

    #gameCanvas {
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(255, 182, 193, 0.45);
        border: 4px solid #ffd1e8;
        max-width: 100%;
        height: auto;
        touch-action: none;
        display: block;
    }

    .tip {
        margin-top: 10px;
        color: #7a6a7a;
        font-size: 13px;
        background: #ffffff;
        padding: 6px 14px;
        border-radius: 999px;
        text-align: center;
    }

    .touch-controller {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(3, 70px);
        grid-template-rows: repeat(2, 70px);
        gap: 8px;
    }

    .touch-btn {
        width: 70px;
        height: 70px;
        font-size: 24px;
        background: #ffcde2;
        border: none;
        border-radius: 16px;
        color: #6b446b;
        box-shadow: 0 3px 8px rgba(255, 150, 180, 0.3);
    }

    .empty {
        background: transparent;
        box-shadow: none;
    }
</style>
</head>
<body>

<h1>🐍 滚滚贪吃蛇 🎆</h1>

<div class="info-panel">
    <div>当前分数：<span id="score">0</span></div>
    <div>🏆 最高分：<span id="highScore">0</span></div>
    <div id="buffTip"></div>
</div>

<div class="control-bar">
    <button id="startBtn">开始游戏</button>
    <button id="pauseBtn">暂停</button>
    <button id="resetBtn">重新开始</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div class="tip">
    💻电脑：方向键 / WASD｜📱手机：点下方方向按钮｜无限地图｜🛡护盾 ⚡加速 ❄冰冻
</div>

<div class="touch-controller">
    <div class="empty"></div>
    <button class="touch-btn" data-dir="up">↑</button>
    <div class="empty"></div>
    <button class="touch-btn" data-dir="left">←</button>
    <button class="touch-btn" data-dir="down">↓</button>
    <button class="touch-btn" data-dir="right">→</button>
</div>

<script>
// ========== 获取页面DOM元素 ==========
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");
const buffTipEl = document.getElementById("buffTip");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");

// ========== 画布基础配置 ==========
const W = canvas.width;
const H = canvas.height;
const BASE_WIDTH = 14;         //蛇身基础粗细
const MOVE_SPEED = 2.6;        //普通移动速度
const FAST_SPEED = 4.4;        //加速道具速度

// ========== 游戏全局变量 ==========
let snake = [];                //蛇路径点数组
let foodList = [];             //食物数组（包含加分食物+增益道具）
let particles = [];            //烟花粒子数组
let dx = 1;                    //X方向移动向量
let dy = 0;                    //Y方向移动向量
let score = 0;                 //当前得分
let lastTime = 0;              //帧时间戳
let rafId = null;              //requestAnimationFrame ID
let isRunning = false;         //游戏运行标记
let isPause = false;           //暂停标记

// ========== 食物/道具配置 ==========
const foodTypes = [
    { type: "red",  color: "#ff6b81", point: 1, buff: null },
    { type: "blue", color: "#74b9ff", point: 2, buff: null },
    { type: "gold", color: "#ffd93d", point: 3, buff: null },
    { type: "shield", color: "#7be0c5", point: 0, buff: "shield" },
    { type: "speed",  color: "#ffb86c", point: 0, buff: "speed" },
    { type: "freeze", color: "#b19cff", point: 0, buff: "freeze" }
];
//彩虹蛇身颜色数组
const rainbowColors = [
    "#ff6b81", "#ffa94d", "#ffd93d", "#8ce3a6",
    "#74b9ff", "#a29bfe", "#ff9ff3"
];

// ========== 增益buff状态 ==========
let buff = {
    shield: false,
    speed: false,
    freeze: false
};
let buffTimer = null;

// ========== 读取本地存储最高分 ==========
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
highScoreEl.innerText = highScore;

// ========== 清除全部buff ==========
function clearBuff() {
    buff.shield = false;
    buff.speed = false;
    buff.freeze = false;
    buffTipEl.textContent = "";
    if (buffTimer) {
        clearTimeout(buffTimer);
        buffTimer = null;
    }
}

// ========== 设置增益buff并计时 ==========
function setBuff(type, duration, text) {
    clearBuff();
    buff[type] = true;
    buffTipEl.textContent = text;
    buffTimer = setTimeout(() => {
        buff[type] = false;
        buffTipEl.textContent = "";
    }, duration);
}

// ========== 初始化游戏 ==========
function initGame() {
    snake = [];
    dx = 1;
    dy = 0;
    const startX = W / 2;
    const startY = H / 2;
    //生成蛇初始路径点
    for (let i = 0; i < 12; i++) {
        snake.push({x: startX - i * BASE_WIDTH, y: startY});
    }
    score = 0;
    scoreEl.innerText = score;
    foodList = [];
    particles = [];
    clearBuff();
    //一次性生成15个食物
    for (let i = 0; i < 15; i++) spawnOneFood();
}

// ========== 生成单个食物，防止生成在蛇身上 ==========
function spawnOneFood() {
    let newFood;
    let safety = 0;
    do {
        newFood = {
            x: 20 + Math.random() * (W - 40),
            y: 20 + Math.random() * (H - 40),
            type: foodTypes[Math.floor(Math.random() * foodTypes.length)].type
        };
        safety++;
    } while ((isOnSnake(newFood) || isOnFoodList(newFood)) && safety < 100);
    foodList.push(newFood);
}

// 判断坐标是否在蛇身上
function isOnSnake(pos) {
    for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const d = Math.hypot(seg.x - pos.x, seg.y - pos.y);
        if (d < BASE_WIDTH * 0.8) return true;
    }
    return false;
}

// 判断坐标是否和已有食物重叠
function isOnFoodList(pos) {
    for (let i = 0; i < foodList.length; i++) {
        const f = foodList[i];
        const d = Math.hypot(f.x - pos.x, f.y - pos.y);
        if (d < BASE_WIDTH) return true;
    }
    return false;
}

// ========== 创建吃到食物的烟花粒子效果 ==========
function createFirework(x, y, color) {
    for (let i = 0; i < 14; i++) {
        const angle = (Math.PI * 2 * i) / 14;
        const speed = 1.1 + Math.random() * 0.7;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 24, maxLife: 24,
            color: color, size: 2 + Math.random() * 2
        });
    }
}

// ========== 更新粒子状态 ==========
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// ========== 贝塞尔曲线绘制平滑彩虹蛇身 ==========
function drawSnake() {
    if(snake.length < 2) return;
    ctx.save();
    if(buff.shield) ctx.globalAlpha = 0.55;

    //底层底色粗线条
    ctx.beginPath();
    ctx.moveTo(snake[0].x, snake[0].y);
    for(let i=1; i<snake.length-1; i++){
        const xc = (snake[i].x + snake[i+1].x)/2;
        const yc = (snake[i].y + snake[i+1].y)/2;
        ctx.quadraticCurveTo(snake[i].x, snake[i].y, xc, yc);
    }
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.lineWidth = BASE_WIDTH;
    ctx.strokeStyle = "#ff9f43";
    ctx.stroke();

    //分段彩虹描边
    for(let i=0; i<snake.length-1; i++){
        ctx.beginPath();
        ctx.moveTo(snake[i].x, snake[i].y);
        const xc = (snake[i].x + snake[i+1].x)/2;
        const yc = (snake[i].y + snake[i+1].y)/2;
        ctx.quadraticCurveTo(snake[i].x, snake[i].y, xc, yc);
        ctx.lineCap="round";
        ctx.lineJoin="round";
        ctx.lineWidth = BASE_WIDTH *0.75;
        ctx.strokeStyle = rainbowColors[i % rainbowColors.length];
        ctx.stroke();
    }

    //绘制蛇头圆形
    const head = snake[0];
    ctx.fillStyle="#ff9f43";
    ctx.beginPath();
    ctx.arc(head.x, head.y, BASE_WIDTH/2,0,Math.PI*2);
    ctx.fill();

    //蛇眼睛，跟随前进方向自动转向
    const angle = Math.atan2(dy, dx);
    const eyeR = 3;
    const eyeOffset = 4;
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(
        head.x + Math.cos(angle - 0.4) * eyeOffset,
        head.y + Math.sin(angle - 0.4) * eyeOffset,
        eyeR, 0, Math.PI * 2
    );
    ctx.arc(
        head.x + Math.cos(angle + 0.4) * eyeOffset,
        head.y + Math.sin(angle + 0.4) * eyeOffset,
        eyeR, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(
        head.x + Math.cos(angle - 0.4) * eyeOffset,
        head.y + Math.sin(angle - 0.4) * eyeOffset,
        1.6, 0, Math.PI * 2
    );
    ctx.arc(
        head.x + Math.cos(angle + 0.4) * eyeOffset,
        head.y + Math.sin(angle + 0.4) * eyeOffset,
        1.6, 0, Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
}

// ========== 绘制全部游戏画面 ==========
function draw() {
    ctx.clearRect(0, 0, W, H);
    //绘制食物
    foodList.forEach(food => {
        const info = foodTypes.find(item => item.type === food.type);
        let alpha = 1;
        if (buff.freeze) {
            if (Math.floor(Date.now() / 120) % 2 === 0) alpha = 0.4;
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = info.color;
        ctx.beginPath();
        ctx.arc(food.x, food.y, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.beginPath();
        ctx.arc(food.x - 3, food.y - 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    drawSnake();
    //绘制烟花粒子
    particles.forEach(p => {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ========== 游戏逻辑更新 ==========
function update(currentTime) {
    if (!isRunning || isPause) {
        rafId = requestAnimationFrame(update);
        return;
    }
    if (!lastTime) lastTime = currentTime;
    lastTime = currentTime;

    //冰冻buff状态下蛇停止移动
    if (!buff.freeze) {
        const speed = buff.speed ? FAST_SPEED : MOVE_SPEED;
        const head = snake[0];
        const newHead = {
            x: head.x + dx * speed,
            y: head.y + dy * speed
        };
        //无限地图：穿出画布从对面出现
        newHead.x = (newHead.x + W) % W;
        newHead.y = (newHead.y + H) % H;

        snake.unshift(newHead);
        let ate = false;

        //检测是否吃到食物
        for (let i = 0; i < foodList.length; i++) {
            const food = foodList[i];
            const d = Math.hypot(newHead.x - food.x, newHead.y - food.y);
            if (d < BASE_WIDTH * 0.7) {
                const info = foodTypes.find(item => item.type === food.type);
                score += info.point;
                scoreEl.innerText = score;
                createFirework(food.x, food.y, info.color);
                foodList.splice(i,1);
                spawnOneFood();
                //触发对应道具效果
                if(info.buff === "shield") setBuff("shield",5000,"🛡护盾生效5秒");
                else if(info.buff === "speed") setBuff("speed",3000,"⚡加速生效3秒");
                else if(info.buff === "freeze") setBuff("freeze",3000,"❄全场冰冻3秒");
                ate = true;
                break;
            }
        }
        //没有吃到食物，删除尾巴保持长度不变
        if (!ate) snake.pop();

        //自碰撞判定，护盾状态免疫自撞
        if (!buff.shield) {
            for (let i = 4; i < snake.length; i++) {
                const d = Math.hypot(newHead.x - snake[i].x, newHead.y - snake[i].y);
                if (d < BASE_WIDTH * 0.5) {
                    gameOver();
                    return;
                }
            }
        }
    }
    updateParticles();
    draw();
    rafId = requestAnimationFrame(update);
}

// ========== 开始游戏 ==========
function startGame() {
    if (isRunning && !isPause) return;
    if (!isRunning) {
        initGame();
        lastTime = 0;
    }
    isPause = false;
    isRunning = true;
    if (!rafId) rafId = requestAnimationFrame(update);
}

// ========== 暂停游戏 ==========
function pauseGame() {
    if (!isRunning) return;
    isPause = true;
}

// ========== 重置游戏 ==========
function resetGame() {
    isRunning = false;
    isPause = false;
    lastTime = 0;
    if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
    }
    initGame();
    draw();
}

// ========== 游戏结束处理 ==========
function gameOver() {
    isRunning = false;
    //更新最高分
    if (score > highScore) {
        highScore = score;
        localStorage.setItem("snakeHighScore", highScore);
        highScoreEl.innerText = highScore;
    }
    alert("游戏结束！得分：" + score + "\n最高分：" + highScore);
}

// ========== 修改移动方向，禁止180度掉头 ==========
function changeDir(dir) {
    if (!isRunning || isPause) return;
    if (dir === "up" && dy !== 1) { dx = 0; dy = -1; }
    else if (dir === "down" && dy !== -1) { dx = 0; dy = 1; }
    else if (dir === "left" && dx !== 1) { dx = -1; dy = 0; }
    else if (dir === "right" && dx !== -1) { dx = 1; dy = 0; }
}

// ========== 键盘监听（PC端WASD + 方向键） ==========
document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    if (key === "arrowup" || key === "w") changeDir("up");
    else if (key === "arrowdown" || key === "s") changeDir("down");
    else if (key === "arrowleft" || key === "a") changeDir("left");
    else if (key === "arrowright" || key === "d") changeDir("right");
});

// ========== 手机触屏方向按钮监听 ==========
document.querySelectorAll(".touch-btn").forEach(btn => {
    btn.addEventListener("click", () => changeDir(btn.dataset.dir));
});

//绑定按钮点击事件
startBtn.onclick = startGame;
pauseBtn.onclick = pauseGame;
resetBtn.onclick = resetGame;

//页面初始化渲染
initGame();
draw();
rafId = requestAnimationFrame(update);
</script>

</body>
</html>
